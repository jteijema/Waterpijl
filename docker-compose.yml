services:
  waterpijl:
    image: ghcr.io/jteijema/waterpijl:latest
    container_name: waterpijl
    restart: always
    environment:
      - ALERT_LEVEL=${ALERT_LEVEL:-200}
      - LOCATION_CODE=${LOCATION_CODE}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 8,14,20 * * *}
      - DATA_DIR=/data
      - DB_PATH=/data/waterpijl.db
      - WEBAPP_PORT=7261
    ports:
      - "7261:7261"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7261/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - waterpijl_data:/data
      - /etc/localtime:/etc/localtime:ro

  checker:
    image: ghcr.io/jteijema/waterpijl:latest
    container_name: waterpijl-checker
    restart: always
    command: ["python", "src/checker.py"]
    environment:
      - ALERT_LEVEL=${ALERT_LEVEL:-200}
      - LOCATION_CODE=${LOCATION_CODE}
      - FORECAST_DAYS=${FORECAST_DAYS:-5}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 8,14,20 * * *}
      - KEEP_DAYS=${KEEP_DAYS:-60}
      - DATA_DIR=/data
      - DB_PATH=/data/waterpijl.db
      - EMAIL_QUEUE_DIR=/data/queue
      - LOG_LEVEL=INFO
    volumes:
      - waterpijl_data:/data
    depends_on:
      - waterpijl

  email:
    image: ghcr.io/jteijema/waterpijl:latest
    container_name: waterpijl-email
    restart: always
    command: ["python", "src/email_worker.py"]
    environment:
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_TO=${EMAIL_TO}
      - EMAIL_TEMPLATE_FILE=/app/email_template.txt
      - EMAIL_QUEUE_DIR=/data/queue
      - DATA_DIR=/data
      - LOG_LEVEL=INFO
    volumes:
      - waterpijl_data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - waterpijl

volumes:
  waterpijl_data: